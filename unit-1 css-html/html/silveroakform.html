<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Inquiry Form</title>

  <link rel="stylesheet" href="../css/silveroakform.css">
</head>

<body>

  <div class="container">

    <!-- LEFT IMAGE SECTION -->

    <div class="left"></div>

    <!-- RIGHT FORM SECTION -->

    <div class="right">

      <div class="content">

        <h1 class="title">ADMISSION INQUIRY</h1>

        <div class="form-box">

          <form>

            <div class="input-box">
              <input type="text" placeholder="Full Name *" required>
            </div>

            <div class="input-box">
              <input type="email" placeholder="Email Address">
            </div>

            <div class="input-box">
              <input type="tel" placeholder="Phone Number *" required>
            </div>

            <div class="input-box">
              <select required>
                <option value="" disabled selected>Select Country *</option>
                <option>India</option>
                <option>USA</option>
                <option>Canada</option>
              </select>
            </div>

            <div class="input-box">
              <select required>
                <option value="" disabled selected>Select State *</option>
                <option>Gujarat</option>
                <option>Maharashtra</option>
                <option>Delhi</option>
              </select>
            </div>

            <div class="input-box">
              <select required>
                <option value="" disabled selected>Select City *</option>
                <option>Ahmedabad</option>
                <option>Surat</option>
                <option>Rajkot</option>
              </select>
            </div>

            <div class="input-box">
              <select required>
                <option value="" disabled selected>Select Specialization *</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>MCA</option>
              </select>
            </div>

            <button type="submit" class="btn">
              Apply Now
            </button>

            <p class="bottom-text">
              Already Applied?
            </p>

          </form>

        </div>

      </div>

    </div>

  </div>

</body>

</html>
