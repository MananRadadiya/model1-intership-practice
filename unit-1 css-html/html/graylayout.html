<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gray Layout</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#d9d9d9;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:90%;
      max-width:1000px;
      background:#f2f2f2;
      padding:10px;
      border:2px solid #999;
    }

    .header{
      background:#666;
      color:white;
      text-align:center;
      padding:25px;
      margin-bottom:10px;
      font-size:24px;
    }

    .navbar{
      background:#808080;
      color:white;
      text-align:center;
      padding:15px;
      margin-bottom:10px;
      font-size:20px;
    }

    .main{
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }

    .sidebar{
      width:30%;
      background:#999;
      color:white;
      text-align:center;
      padding:80px 20px;
      font-size:20px;
    }

    .content{
      width:70%;
      background:#b3b3b3;
      color:white;
      text-align:center;
      padding:80px 20px;
      font-size:20px;
    }

    .footer{
      background:#666;
      color:white;
      text-align:center;
      padding:20px;
      font-size:20px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      HEADER
    </div>

    <div class="navbar">
      NAVIGATION BAR
    </div>

    <div class="main">

      <div class="sidebar">
        SIDEBAR
      </div>

      <div class="content">
        MAIN CONTENT AREA
      </div>

    </div>

    <div class="footer">
      FOOTER
    </div>

  </div>

</body>
</html>
